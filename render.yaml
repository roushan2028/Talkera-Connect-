services:
  - type: web
    name: chatapp-api
    runtime: node
    plan: free
    rootDir: BackEnd
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URL
        sync: false
      - key: JWT_TOKEN
        generateValue: true
      - key: FRONTEND_URL
        sync: false

  - type: web
    name: chatapp-web
    runtime: static
    rootDir: BackEnd/FrontEnd
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: chatapp-api
          property: host
